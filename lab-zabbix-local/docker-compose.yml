version: '3.8'

services:

  zabbix-db:
    image: mysql:8.0
    container_name: local-zabbix-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_pwd_secret
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd_secret
      - MYSQL_DATABASE=zabbix
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log_bin_trust_function_creators=1
    volumes:
      - ./mysql_data:/var/lib/mysql


  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-6.4-latest
    container_name: local-zabbix-server
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd_secret
    depends_on:
      - zabbix-db

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-6.4-latest
    container_name: local-zabbix-web
    ports:
      - "8080:8080"
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd_secret
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Europe/Paris
    depends_on:
      - zabbix-server
      - zabbix-db