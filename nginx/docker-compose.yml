version: '3.8'

services:
  proxy-atlas:
    image: nginx:alpine
    container_name: nginx-proxy-atlas
    restart: always
    ports:
      - "10.20.0.10:80:80"
      - "10.20.0.10:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge